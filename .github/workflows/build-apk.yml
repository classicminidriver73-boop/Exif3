name: Crea EditorEXIF APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME"

       - name: Installa SDK Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle --no-daemon assembleDebug

      - name: Prepara APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/EditorEXIF.apk

      - name: Rendi APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: EditorEXIF-APK
          path: output/EditorEXIF.apk
