name: Crea EditorEXIF APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4
      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -name sdkmanager -type f || true
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android command-line tools mancanti" >&2
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila APK
        run: gradle --no-daemon assembleDebug
      - name: Prepara APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/EditorEXIF-v2.apk
      - name: Scarica APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorEXIF-v2-APK
          path: output/EditorEXIF-v2.apk
          if-no-files-found: error
